name: nva-webhook CI

on:
  push:
    branches:
      - main
    paths:
      - 'nva-webhook/**'
      - '.github/workflows/nva-webhook-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'nva-webhook/**'
      - '.github/workflows/nva-webhook-ci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'nva-webhook/package-lock.json'

      - name: Install, check, and test
        run: cd nva-webhook && npm ci && npm run check && npm test
