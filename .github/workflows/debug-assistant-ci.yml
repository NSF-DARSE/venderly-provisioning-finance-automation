name: debug-assistant CI

on:
  push:
    branches:
      - main
    paths:
      - 'debug-assistant/**'
      - '.github/workflows/debug-assistant-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'debug-assistant/**'
      - '.github/workflows/debug-assistant-ci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'debug-assistant/package-lock.json'

      - name: Install and check
        run: cd debug-assistant && npm ci && npm run check
